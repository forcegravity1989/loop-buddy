<!DOCTYPE html>
<html data-proto="v4-hifi" data-version="6" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builders' Workbench</title>
<style>
:root{
  --paper:#EFEBE2; --rail-bg:#E9E3D7; --clay:#C5654A; --clay-dim:#e2b2a4;
  --card:#FBFAF6; --card-alt:#F4F0E7; --border:#E2DCCF; --border-deep:#DBD4C5;
  --ink:#23211C; --ink-2:#57534A; --ink-3:#8C867A; --ink-4:#A19B8D;
  --agent:#5A4E7A; --alert-deep:#A33D29;
  --green:#6B8E5A; --amber:#D3A24A; --red:#C0463A; --gray:#9A9590;
  --up:#5F7355; --down:#B0503A; --warn-text:#B5862F;
  --shadow:0 8px 26px rgba(35,33,28,.08);
  --serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  --sans:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
::selection{background:#E7CFC4;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#D8D1C2;border-radius:6px;border:3px solid var(--paper);}
::-webkit-scrollbar-track{background:transparent;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;font-size:13px;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;color:var(--ink);}
textarea{resize:vertical;}
input:focus,textarea:focus,select:focus{outline:1.5px solid var(--clay);outline-offset:0;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;margin:0 0 8px;}

/* ---------- atoms ---------- */
.mono{font-family:var(--mono);}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;line-height:16px;white-space:nowrap;background:#EFE9DA;color:var(--ink-2);}
.chip-clay{background:var(--clay);color:#fff;}
.chip-outline{background:transparent;border:1px solid var(--clay);color:var(--clay);}
.chip-green{background:#E7EDE2;color:#4A5E42;}
.chip-red{background:#F3DFD8;color:var(--alert-deep);}
.chip-gray{background:#EFEADF;color:var(--ink-3);}
.btn{cursor:pointer;background:#fff;border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:7px 14px;font-size:12.5px;white-space:nowrap;}
.btn:hover{border-color:var(--clay);color:var(--clay);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:disabled:hover{border-color:var(--border);color:var(--ink);}
.btn-primary{cursor:pointer;background:var(--clay);border:1px solid var(--clay);color:#fff;border-radius:8px;padding:9px 20px;font-size:13.5px;font-weight:500;}
.btn-primary:hover{background:#B1573F;}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;background:#B89A8E;border-color:#B89A8E;}
.btn-sm{padding:4px 10px;font-size:11.5px;border-radius:6px;}
.btn-ghost{background:transparent;border:1px solid transparent;}
.btn-ghost:hover{background:#EFE9DA;border-color:transparent;color:var(--ink);}
.btn-danger{background:var(--alert-deep);color:#fff;border:1px solid var(--alert-deep);}
.btn.active{background:var(--clay);color:#fff;border-color:var(--clay);}
.input,.textarea,select.select{width:100%;background:#FFFDF8;border:1px solid var(--border-deep);border-radius:8px;padding:8px 11px;font-size:13px;line-height:1.5;font-family:inherit;}
.textarea{resize:vertical;min-height:44px;}
.label{font-size:11.5px;color:var(--ink-3);margin:0 0 5px;display:block;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}
.dot-lg{width:13px;height:13px;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.32;}}
.dot-run{animation:pulse 1.2s ease-in-out infinite;}
.asterisk{color:var(--clay);font-weight:700;}
.spacer{flex:1;}
.hidden{display:none !important;}

/* ---------- shell ---------- */
#app{display:flex;height:100vh;overflow:hidden;background:var(--paper);}
.iconrail{width:64px;flex:0 0 64px;background:var(--rail-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;}
.rail-logo{width:34px;height:34px;border-radius:9px;background:var(--clay);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:17px;margin-bottom:10px;flex:none;}
.rail-btn{width:40px;height:40px;border:none;border-radius:9px;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink-3);}
.rail-btn svg{width:19px;height:19px;}
.rail-btn:hover{background:#DED5C2;}
.rail-btn.active{background:#DED5C2;color:var(--ink);}

.projectrail{width:198px;flex:0 0 198px;background:var(--rail-bg);border-right:1px solid var(--border);padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
.pr-back{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 2px;}
.pr-back svg{width:13px;height:13px;}
.pr-back:hover{color:var(--clay);}
.pr-head{padding-bottom:10px;border-bottom:1px solid var(--border);}
.pr-head-name{font-family:var(--serif);font-weight:700;font-size:14.5px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pr-head-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-3);font-family:var(--mono);}
.pr-nav{display:flex;flex-direction:column;gap:2px;}
.pr-link{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer;}
.pr-link svg{width:15px;height:15px;flex:none;}
.pr-link:hover{background:#DED5C2;}
.pr-link.active{background:var(--clay);color:#fff;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:52px;flex:0 0 52px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;padding:0 18px;gap:12px;}
.topbar-title{font-family:var(--serif);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.demo-tag{font-size:10.5px;color:var(--ink-3);background:transparent;border:1px solid var(--border);border-radius:999px;padding:2px 10px;white-space:nowrap;}
.avatar-chip{width:26px;height:26px;border-radius:50%;background:var(--clay);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;}
.pr-badge{margin-left:auto;background:var(--clay);color:#fff;font-size:10px;border-radius:8px;padding:0 5px;min-width:14px;text-align:center;line-height:16px;flex:none;}
.env-help{color:var(--clay);cursor:pointer;font-size:11px;margin-left:2px;}
.env-help:hover{text-decoration:underline;}
.content{flex:1;overflow-y:auto;padding:20px 24px 60px;min-width:0;}

/* ---------- wall ---------- */
[data-screen="wall"]{max-width:1300px;}
.wall-topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.wall-topline h1{font-size:21px;margin:0;}
.envbar,.healthbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:11px 16px;margin-bottom:11px;}
.bar-label{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase;flex:none;}
.env-item{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;}
.env-item.fail{color:var(--alert-deep);}
.health-group{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;}
.wall-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:15px 17px;cursor:pointer;}
.pcard:hover{border-color:var(--clay);}
.pcard-top{display:flex;align-items:center;gap:6px;margin-bottom:11px;}
.pcard-x{margin-left:auto;background:transparent;border:none;color:var(--ink-3);font-size:14px;padding:0 0 0 6px;}
.pcard-x:hover{color:var(--alert-deep);}
.pcard-name{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:5px;}
.pcard-oneliner{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-bottom:9px;min-height:19px;}
.pcard-meta{font-size:11.5px;color:var(--ink-3);margin-bottom:9px;display:flex;gap:13px;flex-wrap:wrap;}
.pcard-bar{height:6px;border-radius:3px;background:#E6E0D2;overflow:hidden;}
.pcard-bar-fill{height:100%;background:var(--clay);border-radius:3px;}
.pcard-del{margin-top:11px;padding-top:11px;border-top:1px dashed var(--ink-3);display:flex;align-items:center;gap:8px;font-size:11.5px;}
.newcard{border:1.6px dashed var(--border-deep);border-radius:10px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--ink-3);}
.newcard:hover{border-color:var(--clay);}
.newcard .plus{font-size:24px;color:var(--clay);}

/* ---------- onboard ---------- */
[data-screen="onboard"]{max-width:880px;}
.ob-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.ob-cards{display:flex;flex-direction:column;gap:14px;}
.ob-card{padding:17px 19px;}
.ob-card h3{font-size:14.5px;margin-bottom:11px;}
.tabrow{display:flex;gap:6px;margin-bottom:11px;}
.pillrow{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap;}
.pill{padding:6px 14px;border-radius:15px;border:1px solid var(--border-deep);font-size:12.5px;cursor:pointer;background:#fff;color:var(--ink-2);}
.pill.active{border:1.5px solid var(--clay);color:var(--clay);font-weight:600;}
.repolist{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto;margin-top:8px;}
.repo-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:12.5px;}
.repo-row:hover{border-color:var(--clay);}
.repo-row.sel{border-color:var(--clay);background:#FBEEE9;}
.formrow{margin-bottom:11px;}
.formgrid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.probe3{display:flex;gap:16px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--ink-3);flex-wrap:wrap;}
.ob-actions{display:flex;justify-content:flex-end;margin-top:2px;gap:8px;}

/* ---------- settings ---------- */
[data-screen="settings"]{max-width:640px;}
.settings-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);gap:12px;}
.settings-row:last-child{border-bottom:none;}
.settings-row .k{font-size:13px;font-weight:600;}
.settings-row .v{font-size:12px;color:var(--ink-3);}

/* ---------- overview ---------- */
[data-screen="overview"]{max-width:1120px;}
.ov-stack{display:flex;flex-direction:column;gap:14px;}
.ov-banner{background:#FBEEE9;border:1px solid var(--clay-dim);border-radius:9px;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;flex-wrap:wrap;gap:8px;}
.ov-block{padding:16px 18px;}
.ov-block1{display:flex;gap:22px;flex-wrap:wrap;}
.ov-block1 .info{flex:1.7;min-width:280px;}
.ov-block1 .health{flex:1;min-width:230px;padding-left:22px;border-left:1px solid var(--border);}
@media (max-width:760px){ .ov-block1 .health{border-left:none;padding-left:0;border-top:1px dashed var(--border);padding-top:14px;} }
.ov-block-title{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px;}
.ov-row{display:flex;gap:14px;flex-wrap:wrap;}
.ov-row .mcard{flex:1;min-width:200px;}
.repo-metric-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.repo-metric-head h3{font-family:var(--serif);font-size:15px;margin:0;}
.repo-metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;}
.repo-metric-item{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 11px;}
.repo-metric-item .v{font-family:var(--mono);font-weight:700;font-size:16px;}
.repo-metric-item .k{font-size:10.3px;color:var(--ink-3);margin-top:2px;}
.week-counts{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin:2px 0 10px;flex-wrap:wrap;}
.week-counts b{font-family:var(--mono);color:var(--ink);}
.ops-chip-row{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px;}

.charter-name{font-family:var(--serif);font-size:19px;font-weight:700;margin-bottom:6px;}
.charter-line{font-size:12.8px;color:var(--ink-2);margin-bottom:5px;line-height:1.5;}
.charter-line .k{color:var(--ink-3);font-size:11px;margin-right:4px;}
.charter-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:10px;padding-top:10px;border-top:1px solid var(--border);align-items:center;}
.mr-banner{margin-top:11px;background:#F3E3C4;border:1px solid #E3C78F;border-radius:8px;padding:8px 12px;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}

.health-big{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.health-word{font-weight:700;font-size:15px;font-family:var(--serif);}
.health-reasons{display:flex;flex-direction:column;gap:4px;}
.health-reason{display:flex;gap:7px;font-size:12.3px;padding:5px 6px;border-radius:6px;cursor:pointer;}
.health-reason:hover{background:#EEE6D3;}
.health-reason .mark{flex:none;}

.metric-col{flex:1;display:flex;flex-direction:column;gap:8px;min-width:190px;}
.metric-col-title{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}
.mcard{background:#fff;border:1px solid var(--border);border-radius:9px;padding:11px 13px;}
.mcard.gray{background:#F1EEE4;}
.mcard.north{border-left:4px solid var(--clay);}
.mcard-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.mcard-name{font-family:var(--serif);font-size:13px;font-weight:600;flex:1;min-width:0;}
.mcard-name.big{font-size:15px;}
.mcard-value-row{display:flex;align-items:baseline;gap:6px;margin-bottom:3px;}
.mcard-value{font-family:var(--mono);font-weight:700;font-size:19px;}
.mcard-value.big{font-size:23px;}
.mcard-target{font-family:var(--mono);font-size:11.3px;color:var(--ink-3);}
.mcard-sub{font-size:10.3px;color:var(--ink-3);}
.mcard-driven{margin-top:7px;display:flex;gap:4px;flex-wrap:wrap;}
.badge-manual{display:inline-block;font-size:9.5px;background:#E7E0CF;border-radius:4px;padding:0 5px;margin-left:4px;color:var(--ink-3);}

.week-goal{font-size:13.2px;margin-bottom:8px;}
.week-progress{height:10px;border-radius:5px;overflow:hidden;display:flex;border:1px solid var(--border);margin-bottom:10px;}

.version-cols{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:9px;}
.version-col .k{font-size:11px;color:var(--ink-3);}
.version-col .v{font-family:var(--mono);font-size:15px;font-weight:700;}
.release-line{font-size:11.3px;color:var(--ink-3);margin-top:3px;}
.repostats{font-size:11px;color:var(--ink-3);margin-top:10px;padding-top:9px;border-top:1px solid var(--border);font-family:var(--mono);line-height:1.7;}

/* ---------- plan ---------- */
[data-screen="plan"]{height:calc(100vh - 92px);max-width:1560px;}
.plan-grid{display:grid;grid-template-columns:180px 1fr;gap:14px;height:100%;min-height:0;}
.plan-col{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow-y:auto;padding:12px;}
.plan-allrow{padding:8px 9px;border-radius:7px;font-size:13px;cursor:pointer;font-weight:600;margin-bottom:6px;}
.plan-allrow:hover{background:#EEE6D3;}
.plan-allrow.active{background:var(--clay);color:#fff;}
.plan-weekrow{padding:7px 9px;border-radius:7px;font-size:12.5px;cursor:pointer;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;}
.plan-weekrow:hover{background:#EEE6D3;}
.plan-weekrow.active{background:var(--clay);color:#fff;}
.plan-weekgroup{margin:10px 0 4px;font-size:11px;letter-spacing:.4px;color:var(--ink-3);}
.chip-muted{background:#E4DCCB;color:var(--ink-3);font-size:10.5px;padding:1px 5px;border-radius:5px;}
.plan-weekrow.active .chip-muted{background:rgba(255,255,255,.25);color:#fff;}
.plan-versionsel{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.plan-mid{display:flex;flex-direction:column;min-width:0;height:100%;background:transparent;border:none;box-shadow:none;padding:0;overflow:visible;}
.plan-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;gap:10px;flex-wrap:wrap;flex:none;}
.plan-toolbar .left{font-size:14px;font-family:var(--serif);font-weight:700;}
.plan-toolbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.switch{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);cursor:pointer;user-select:none;}
.goal-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:13.2px;margin-bottom:9px;flex:none;}
.filter-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;flex:none;}
.filter-bar select,.filter-bar input{padding:5px 8px;font-size:11.5px;border:1px solid var(--border);border-radius:6px;background:#fff;}
.filter-bar input{width:150px;}
.detail-empty{font-size:12.5px;color:var(--ink-3);padding:16px 4px;}
.detail-title{font-size:15px;font-weight:700;font-family:var(--serif);margin-bottom:10px;}
.detail-row{margin-bottom:9px;font-size:12.5px;}
.detail-row .k{font-size:10.5px;color:var(--ink-3);margin-bottom:2px;}
.detail-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;}

.kanban{flex:1;display:flex;gap:11px;min-height:0;overflow-x:auto;padding-bottom:4px;}
.kanban-col{flex:1 1 0;min-width:186px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;overflow-y:auto;transition:background .12s,outline .12s;}
.kanban-col.kanban-col-droppable{outline:2px dashed var(--clay);outline-offset:-2px;background:#FBEEE9;}
.kanban-col.kanban-col-noDrop{outline:2px dashed var(--ink-4);outline-offset:-2px;opacity:.72;}
.kanban-col-head{font-size:11.3px;color:var(--ink-3);margin-bottom:8px;flex:none;}
.kanban-col-def{font-size:9.3px;color:var(--ink-4);font-weight:400;margin-top:2px;line-height:1.4;}
.kcard{background:#fff;border:1px solid var(--border);border-left:3px solid var(--border-deep);border-radius:8px;padding:10px 11px;margin-bottom:8px;flex:none;}
.kcard[draggable="true"]{cursor:grab;}
.kcard.dragging{opacity:.4;}
.kcard-top{font-family:var(--mono);font-size:10.6px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
.kcard-title{font-size:12.6px;color:var(--ink);margin-bottom:8px;line-height:1.4;cursor:pointer;}
.kcard-title:hover{color:var(--clay);}
.kcard-actions{display:flex;gap:10px;flex-wrap:wrap;font-size:11.3px;}
.kcard-actions button{background:transparent;border:none;padding:0;font-size:11.3px;cursor:pointer;font-family:inherit;}
.kcard-actions button:hover{text-decoration:underline;}
.plan-detail{position:fixed;top:52px;right:0;bottom:0;width:360px;background:var(--card);border-left:1px solid var(--border);box-shadow:var(--shadow);z-index:55;display:flex;flex-direction:column;}
.plan-detail-head{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex:none;}
.plan-detail-body{flex:1;overflow-y:auto;padding:16px 18px;}

/* ---------- session (Orca-style) ---------- */
[data-screen="session"]{height:calc(100vh - 92px);max-width:1600px;}
.sess-grid{display:grid;grid-template-columns:216px 1fr 264px;gap:14px;height:100%;min-height:0;}
.sess-col{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
.sess-left-scroll{overflow-y:auto;padding:9px;flex:1;}
.sess-group-label{font-size:10.3px;color:var(--ink-3);font-family:var(--mono);padding:9px 6px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sess-row{display:flex;align-items:flex-start;gap:8px;padding:8px 8px;border-radius:8px;cursor:pointer;margin-bottom:2px;}

function categoryWorkHint(category){
  category=category||'';

  if(/优化/.test(category))return '优化类:先复现再改。';
  if(/运维/.test(category))return '运维类:先复现再改。';
  if(/运营推广/.test(category))return '运营推广类:无默认技能,从鱼塘挑合适的打法。';

function buildGenericTranscript(pid,issueId){

  var files=changedFilesFor(issue),branch=branchOf(issueId);
  var mrLabel=(issue.mr&&issue.mr.label)||('!'+branch);
  var lines=[
    {cls:'sys',text:'[buddy] 系统提示词已注入 · 单人构建者工作台 · 一活一分支一 MR · 完成永远由人点'},
    {cls:'sys',text:'[workflow] workflow 已注入:'+wfName+'(自己调度 agent)'}

    {cls:'git',text:'[mr] 已提 MR '+mrLabel},

  );

}
function TRANSCRIPTS_FOR(pid,issueId){

function getProject(pid){ return pid==='new' ? state.newProject : (state.projects[pid]||null); }
function getIssues(pid){ return state.issues[pid]||{}; }
function getIssue(pid,id){ return (state.issues[pid]||{})[id]||null; }
function allIssuesArr(pid){ var m=getIssues(pid); return Object.keys(m).map(function(k){return m[k];}); }
function getMetric(pid,id){ return (state.metrics[pid]||{})[id]||null; }
function getInbox(pid){ return state.inbox[pid]||[]; }
function inboxCount(pid){ return getInbox(pid).filter(function(x){return x.state!=='merged'&&x.state!=='done';}).length; }
function findInboxItem(pid,id){ return getInbox(pid).filter(function(x){return x.id===id;})[0]||null; }
function weekProgress(pid,week){
  var issues=allIssuesArr(pid).filter(function(i){return i.kind==='business'&&i.week===week;});
  var c={todo:0,doing:0,review:0,done:0};
  issues.forEach(function(i){
    if(i.status==='done')c.done++; else if(i.status==='doing')c.doing++;
    else if(i.status==='review'||i.status==='merged')c.review++; else c.todo++;
  });
  return c;
}
function opsIssuesFor(pid){ return allIssuesArr(pid).filter(function(i){return i.kind==='ops';}); }
function opsChipsHTML(pid){
  var all=opsIssuesFor(pid);
  var nums=['①','②','③'];
  return ['ops1','ops2','ops3'].map(function(prefix,idx){
    var iss=all.filter(function(o){return o.id.indexOf(prefix)===0;})[0];
    if(!iss) return '';
    return '<span class="chip mono" data-issue="'+iss.id+'" data-action="goSession" data-arg=\'["'+pid+'","'+iss.id+'"]\' style="cursor:pointer;border-left:3px solid var(--'+STATUS_DOT[iss.status]+');">'+nums[idx]+' '+esc(STATUS_LABEL[iss.status])+'</span>';
  }).join('');
}

function onIssueCompleted(pid,issue){
  if(issue.category==='运作' && /运作活①/.test(issue.title)){
    var wk=issue.week||CURRENT_WEEK;
    state.weekPlans[pid]=state.weekPlans[pid]||{};
    if(!state.weekPlans[pid][wk]){ state.weekPlans[pid][wk]={goal:'(演示)已由运作活①产出周目标',version:getProject(pid).version}; }
  }
  if(issue.kind==='release'){
    state.releases[pid]=state.releases[pid]||[];
    state.releases[pid].push({version:issue.releaseVersion||issue.version,date:TODAY,note:issue.releaseNote||'',issues:issue.releaseIssues||[]});
  }
}
function mergeIssueGeneric(pid,issueId){
  var issue=getIssue(pid,issueId); if(!issue)return;
  issue.status='merged'; if(issue.mr)issue.mr.status='merged';
  if(issue.kind==='charter'&&issue.draft){ Object.assign(getProject(pid).card,issue.draft); }
  (issue.metricIds||[]).forEach(function(mid){ var m=getMetric(pid,mid); if(m&&typeof m.current==='number'){ m.current+=1; } });
}
function completeIssueGeneric(pid,issueId){
  var issue=getIssue(pid,issueId); if(!issue)return;
  issue.status='done'; issue.doneDate=TODAY_SHORT; onIssueCompleted(pid,issue);
}

/* ===================== 看板拖拽:六列统一,排期直接生效 / 状态动作弹窗确认 ===================== */
var dragState={issueId:null,fromCol:null};
function kanbanOrderArr(pid,col){ state.kanbanOrder=state.kanbanOrder||{}; state.kanbanOrder[pid]=state.kanbanOrder[pid]||{}; state.kanbanOrder[pid][col]=state.kanbanOrder[pid][col]||[]; return state.kanbanOrder[pid][col]; }
function removeFromOrder(pid,col,id){ var arr=kanbanOrderArr(pid,col); var i=arr.indexOf(id); if(i>=0)arr.splice(i,1); }
function insertIntoOrder(pid,col,id,beforeId){
  var arr=kanbanOrderArr(pid,col); var i=arr.indexOf(id); if(i>=0)arr.splice(i,1);
  if(beforeId && beforeId!==id){ var bi=arr.indexOf(beforeId); if(bi>=0){ arr.splice(bi,0,id); return; } }
  arr.push(id);
}
function sortByOrder(pid,col,items){
  var order=(state.kanbanOrder&&state.kanbanOrder[pid]&&state.kanbanOrder[pid][col])||[];
  if(!order.length) return items;
  var idx={}; order.forEach(function(id,i){ idx[id]=i; });
  return items.slice().sort(function(a,b){
    var ai=idx.hasOwnProperty(a.id)?idx[a.id]:9999, bi=idx.hasOwnProperty(b.id)?idx[b.id]:9999;
    return ai-bi;
  });
}

  'pool>blocked':'待办池不能直接标记阻塞,要先排进待办或开工',
  'todo>review':'待办不能直接进入评审中,要先开工',
  'todo>done':'待办不能直接完成,要先经过进行中与评审中',
  'doing>pool':'进行中不能退回待办池,只能退回待办',
  'doing>done':'进行中不能直接完成,要先推到评审中',
  'review>pool':'评审中不能退回待办池,只能退回进行中',
  'review>todo':'评审中不能直接退回待办,只能退回进行中或标记阻塞',
  'blocked>pool':'阻塞不能直接回到待办池,只能退回待办或进行中',
  'blocked>review':'阻塞不能直接进入评审中,要先解除阻塞',
  'blocked>done':'阻塞不能直接完成,要先解除阻塞',
  'done>pool':'已完成不能退回待办池,只能退回待办或进行中',
  'done>review':'已完成不能直接回到评审中',
  'done>blocked':'已完成不能直接标记阻塞'
};
function kanbanLegal(fromCol,toCol){ if(fromCol===toCol)return true; return (KANBAN_LEGAL[fromCol]||[]).indexOf(toCol)>=0; }
function openKanbanConfirm(kind,pid,issueId,fromCol,toCol){
  state.ui.modal={type:'kanban-confirm',kind:kind,pid:pid,issueId:issueId,fromCol:fromCol,toCol:toCol,reason:''};
  render();
}
function handleKanbanDrop(pid,issueId,fromCol,toCol,overId){
  var issue=getIssue(pid,issueId); if(!issue)return;
  if(fromCol===toCol){ insertIntoOrder(pid,toCol,issueId,overId===issueId?null:overId); render(); return; }
  if(!kanbanLegal(fromCol,toCol)){
    var reason=KANBAN_ILLEGAL_REASON[fromCol+'>'+toCol]||'状态不允许这样跳转';
    toast((COL_LABEL[fromCol]||fromCol)+' → '+(COL_LABEL[toCol]||toCol)+' 不允许:'+reason);
    render();
    return;
  }
  if((fromCol==='pool'&&toCol==='todo')||(fromCol==='todo'&&toCol==='pool')){
    var wk=state.ui.planLeft[pid]; if(!wk||wk==='all') wk=CURRENT_WEEK;
    if(toCol==='todo'){ issue.status='todo'; issue.week=wk; toast('已排进 2026-'+wk); }
    else { issue.status='pool'; issue.week=''; toast('已移出本周,回到待办池'); }
    removeFromOrder(pid,fromCol,issueId);
    insertIntoOrder(pid,toCol,issueId,overId===issueId?null:overId);
    render();
    return;
  }
  var kind = toCol==='doing' ? 'start' : toCol==='review' ? 'review' : toCol==='done' ? 'done' : toCol==='blocked' ? 'block' : toCol==='todo' ? 'revert' : null;
  if(!kind){ render(); return; }
  openKanbanConfirm(kind,pid,issueId,fromCol,toCol);
}
document.addEventListener('dragstart', function(e){
  var el=e.target.closest('.kcard[draggable="true"]'); if(!el)return;
  dragState.issueId=el.getAttribute('data-issue');
  var colEl=el.closest('.kanban-col');
  dragState.fromCol=colEl?colEl.getAttribute('data-col'):null;
  el.classList.add('dragging');
  if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragState.issueId); }catch(_){} }
});
document.addEventListener('dragover', function(e){
  if(!dragState.issueId)return;
  var col=e.target.closest('.kanban-col'); if(!col)return;
  e.preventDefault();
  var key=col.getAttribute('data-col');
  var allowed=kanbanLegal(dragState.fromCol,key);
  col.classList.remove('kanban-col-droppable','kanban-col-noDrop');
  col.classList.add(allowed?'kanban-col-droppable':'kanban-col-noDrop');
});
document.addEventListener('dragleave', function(e){
  var col=e.target.closest('.kanban-col');
  if(col && (!e.relatedTarget || !col.contains(e.relatedTarget))){ col.classList.remove('kanban-col-droppable','kanban-col-noDrop'); }
});
document.addEventListener('drop', function(e){
  if(!dragState.issueId)return;
  var col=e.target.closest('.kanban-col'); if(!col)return;
  e.preventDefault();
  col.classList.remove('kanban-col-droppable','kanban-col-noDrop');
  var overCard=e.target.closest('.kcard');
  var toCol=col.getAttribute('data-col'), pid=col.getAttribute('data-pid');
  var overId=overCard?overCard.getAttribute('data-issue'):null;
  handleKanbanDrop(pid,dragState.issueId,dragState.fromCol,toCol,overId);
  dragState.issueId=null; dragState.fromCol=null;
});
document.addEventListener('dragend', function(e){
  var el=e.target.closest('.kcard'); if(el)el.classList.remove('dragging');
  document.querySelectorAll('.kanban-col').forEach(function(c){ c.classList.remove('kanban-col-droppable','kanban-col-noDrop'); });
  dragState.issueId=null; dragState.fromCol=null;
});

document.addEventListener('click', function(e){
  var el=e.target.closest('[data-action]'); if(!el)return;
  var name=el.getAttribute('data-action');
  if(name==='closeModal' && el.classList.contains('modal-backdrop') && e.target!==el) return;
  var raw=el.getAttribute('data-arg');
  var args=[];
  if(raw){ try{ args=JSON.parse(raw); if(!Array.isArray(args))args=[args]; }catch(_){ args=[raw]; } }
  var fn=ACTIONS[name]; if(fn) fn.apply(null,args);
});
document.addEventListener('input', function(e){
  var el=e.target; var bind=el.getAttribute&&el.getAttribute('data-bind'); if(!bind)return;
  setPath(state,bind,el.value); render();
});
document.addEventListener('change', function(e){
  var el=e.target;
  var bindMulti=el.getAttribute&&el.getAttribute('data-bindchange-multi');
  if(bindMulti){ var vals=Array.prototype.slice.call(el.selectedOptions).map(function(o){return o.value;}); setPath(state,bindMulti,vals); render(); return; }
  var bind=el.getAttribute&&el.getAttribute('data-bindchange'); if(!bind)return;
  setPath(state,bind,el.value); render();
});
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter')return;
  var el=e.target; if(!el.matches)return;
  if(el.matches('[data-term-input]')){
    var pid=el.getAttribute('data-pid'), sid=el.getAttribute('data-sid');
    ACTIONS.submitTermInput(pid,sid,el.value); el.value='';
  }
  if(el.matches('[data-symbol-input]')){
    var pid2=el.getAttribute('data-pid');
    ACTIONS.searchSymbol(pid2, el.value);
  }
});
function updateActionBar(issueId){
  var bar=document.querySelector('[data-actionbar="'+issueId+'"]'); if(!bar)return;
  var st=bar.querySelector('[data-status-text]'); var issue=null;
  Object.keys(state.issues).some(function(pid){ var i=getIssue(pid,issueId); if(i){issue=i;return true;} return false; });
  if(st&&issue) st.textContent=STATUS_LABEL[issue.status]||issue.status;
  var play=bar.querySelector('[data-btn="play"]'), stop=bar.querySelector('[data-btn="stop"]');
  if(play) play.disabled=!!state.ui.playing[issueId];
  if(stop) stop.disabled=!state.ui.playing[issueId];
}

function issueActionsHTML(pid,i){
  var playing=!!state.ui.playing[i.id];
  if(i.status==='blocked'){
    return '<span style="color:var(--alert-deep);">⛔ 阻塞</span>'
      + '<button data-action="unblockIssue" data-arg=\'["'+pid+'","'+i.id+'","todo"]\' style="color:var(--clay);">解除→待办</button>';
  }
  if(playing){
    return '<button data-action="stopWork" data-arg=\'["'+pid+'","'+i.id+'"]\' style="color:var(--alert-deep);font-weight:600;">■ 停止</button>';
  }
  if(i.status==='pool'){
    return '<button data-action="startWork" data-arg=\'["'+pid+'","'+i.id+'"]\' style="color:var(--clay);">▶ 开工</button>'
      + '<button data-action="scheduleToWeek" data-arg=\'["'+pid+'","'+i.id+'"]\' style="color:var(--ink-3);">排进本周</button>';
  }
  if(i.status==='todo'){
    return '<button data-action="startWork" data-arg=\'["'+pid+'","'+i.id+'"]\' style="color:var(--clay);">▶ 开工</button>'
      + '<button data-action="blockIssue" data-arg=\'["'+pid+'","'+i.id+'"]\' style="color:var(--ink-3);">⛔ 阻塞</button>';
  }
  if(i.status==='doing'){
    return '<button data-action="goSession" data-arg=\'["'+pid+'","'+i.id+'"]\' style="color:var(--clay);">续聊</button>'
      + '<button data-action="pushReview" data-arg=\'["'+pid+'","'+i.id+'"]\' style="color:var(--clay);">推到评审</button>'
      + '<button data-action="blockIssue" data-arg=\'["'+pid+'","'+i.id+'"]\' style="color:var(--ink-3);">⛔ 阻塞</button>';
  }
  if(i.status==='review'){
    if(i.mr){ return '<button data-action="mergeMR" data-arg=\'["'+pid+'","'+i.id+'"]\' style="color:var(--clay);">⬇ 合入 '+esc(i.mr.label)+'</button>'
      + '<button data-action="mergeAndCompleteIssue" data-arg=\'["'+pid+'","'+i.id+'"]\' style="color:var(--clay);font-weight:600;">合入并完成</button>'; }
    return '<span style="color:var(--ink-3);">等待提 MR</span>';
  }
  if(i.status==='merged'){
    return '<button data-action="completeIssue" data-arg=\'["'+pid+'","'+i.id+'"]\' style="color:var(--clay);font-weight:600;">✓ 点完成</button>';
  }
  if(i.status==='done'){
    return '<span style="color:var(--ink-3);">已完成'+(i.doneDate?(' · '+esc(i.doneDate)):'')+'</span>';
  }
  return '';
}

/* ===================== 渲染:会话(Orca 式三栏) ===================== */
function sessionGroups(pid){
  var proj=getProject(pid); if(!proj) return [];
  var repoShort=(proj.repo||'repo').split('/').pop();
  var groups=[{sid:'shell',groupLabel:repoShort+' · main',title:'仓根 shell',sub:'常驻',dot:'gray',issue:null}];
  var ids = pid==='buddy' ? ['pr-102','w1-2','v4-4','ops2-w33'] : Object.keys(getIssues(pid)).filter(function(id){var i=getIssue(pid,id);return i&&i.kind!=='charter'&&i.status!=='done';});
  ids.forEach(function(id){
    var i=getIssue(pid,id); if(!i)return;
    var dot='gray', sub='空闲';
    if(state.ui.playing[id]){ dot='green'; sub='运行中'; }
    else if(i.tool==='open_design'){ dot='green'; sub='Open Design 打开中'; }
    else if(i.status==='review'||i.status==='merged'){ dot='amber'; sub=(i.auto?'自动 · 已推评审':'等你输入 · 3 分钟前'); }
    else if(i.status==='doing'){ dot='amber'; sub='等你输入'; }
    else if(i.status==='done'){ dot='gray'; sub='已完成'; }
    groups.push({sid:id,groupLabel:repoShort+'-issue-'+issueSuffix(id)+' · '+branchOf(id),title:i.title,sub:sub,dot:dot,issue:i});
  });
  return groups;
}
function baseTabs(issue){
  var tabs=[];
  if(issue&&issue.tool==='open_design'){ tabs.push({id:'od',kind:'od',label:'Open Design'}); }
  tabs.push({id:'terminal',kind:'terminal',label:'终端'});
  return tabs;
}
function highlightLine(line){
  var trimmed=line.replace(/^\s*/,'');
  if(/^(\/\/|#)/.test(trimmed)){ return '<span class="tok-com">'+esc(line)+'</span>'; }
  var out=esc(line);
  out=out.replace(/(&quot;.*?&quot;)/g,'<span class="tok-str">$1</span>');
  out=out.replace(/\b(fn|let|pub|struct|impl|match|if|else|return|use|mod|const|static|async|await|self|mut|for|while|loop|enum|trait|type|where|dyn|Self|workspace|members|label|target)\b/g,'<span class="tok-kw">$1</span>');
  return out;
}
function terminalHTML(pid,sid,issue){
  if(!issue){
    var proj=getProject(pid);
    return '<div class="terminal" data-terminal><div class="term-titlebar"><span>'+esc((proj&&proj.repo)||'')+' · main</span><span style="opacity:.5;">演示</span></div>'
      + '<div class="term-body" data-terminal-body="'+sid+'"><div class="term-line term-idle">$ 等待输入…</div></div>'
      + '<div class="term-input-row"><input placeholder="在此输入…" data-term-input data-pid="'+pid+'" data-sid="'+sid+'"></div></div>';

  return '<div class="terminal" data-terminal><div class="term-titlebar"><span>'+esc(branchOf(sid))+' · '+esc(TOOL_LABEL[issue.tool]||'')+'</span><span style="opacity:.5;">演示</span><span class="spacer"></span><button class="copybtn" data-action="copyTerminal" data-arg=\'"'+sid+'"\'>复制</button></div>'
    + '<div class="term-body" data-terminal-body="'+sid+'">'+body+'</div>'
    + '<div class="term-input-row"><input placeholder="继续对话…" data-term-input data-pid="'+pid+'" data-sid="'+sid+'"></div></div>';

function codeViewHTML(path){
  var lines=FILE_CONTENTS[path]||['// '+path,'(未纳入原型演示内容,真实内容以仓为准)'];
  var body=lines.map(function(l,idx){return '<div class="codeline"><span class="ln">'+(idx+1)+'</span><span class="src">'+highlightLine(l)+'</span></div>';}).join('');
  return '<div class="codeview"><div class="codeview-head">'+esc(path)+' · 只读</div><div class="codeview-body">'+body+'</div></div>';
}
function diffViewHTML(issue,path){
  var files=issue?changedFilesFor(issue):[];
  var f=files.filter(function(x){return x[0]===path;})[0]||[path,'+4','-1'];
  var plus=parseInt(f[1])||1, minus=Math.abs(parseInt(f[2]))||0;
  var lines=[{t:'ctx',s:'--- a/'+path},{t:'ctx',s:'+++ b/'+path},{t:'ctx',s:'@@ -1,'+Math.max(1,minus)+' +1,'+Math.max(1,plus)+' @@'}];
  for(var i=0;i<Math.min(6,Math.max(1,plus));i++){ lines.push({t:'add',s:'+ '+(i===0?'// 新增改动(演示行)':'    line_'+(i+1)+'();')}); }
  if(minus>0){ lines.push({t:'del',s:'- // 旧实现(已移除,演示行)'}); }
  var body=lines.map(function(l){return '<div class="diffline '+l.t+'">'+esc(l.s)+'</div>';}).join('');
  return '<div class="diffview">'+body+'</div>';
}
function odEmbedHTML(){
  return '<div class="od-embed"><div class="od-embed-head">Open Design · 本机内嵌(演示)</div><div class="od-embed-canvas"><span style="font-size:22px;">◐</span><span>Open Design</span></div></div>';
}
function renderTree(pid,sid,node,depth,changedSet){
  var ex=state.ui.treeExpanded[pid]=state.ui.treeExpanded[pid]||{};
  var html='';
  if(node.type==='dir'){
    var expanded=ex.hasOwnProperty(node.path)?ex[node.path]:(node.path===''||node.path==='crates'||node.path==='docs');
    html+='<div class="tree-node dir" style="padding-left:'+(depth*12)+'px;" data-action="toggleTreeDir" data-arg=\'["'+pid+'","'+node.path+'"]\'><span class="tree-arrow">'+(expanded?'▾':'▸')+'</span>'+esc(node.name)+'/</div>';
    if(expanded&&node.children){ node.children.forEach(function(c){ html+=renderTree(pid,sid,c,depth+1,changedSet); }); }
  } else {
    var changed=changedSet[node.path];
    html+='<div class="tree-node file'+(changed?' changed':'')+'" style="padding-left:'+(depth*12+11)+'px;" data-action="openFileTab" data-arg=\'["'+pid+'","'+sid+'","'+node.path+'"]\'>'+esc(node.name)+(changed?' ✱':'')+'</div>';
  }
  return html;
}
function sessionRightHTML(pid,sid,issue){

  var changedHTML=changedList.length?changedList.map(function(f){
    return '<div class="changed-row" data-action="openDiffTab" data-arg=\'["'+pid+'","'+sid+'","'+f[0]+'"]\'><span>'+esc(f[0])+'</span><span class="diffnum"><span class="plus">'+f[1]+'</span><span class="minus">'+f[2]+'</span></span></div>';
  }).join(''):'<div class="detail-empty" style="padding:6px 2px;">无改动</div>';
  var gitHTML=issue
    ?('<div class="git-box">分支 '+esc(branchOf(sid))+'<br>ahead '+(changedList.length||1)+' · behind 0<br>未提交 '+(issue.status==='doing'?1:0)+'</div>')
    :('<div class="git-box">分支 main<br>ahead 0 · behind 0<br>未提交 0</div>');
  var mrHTML='';
  if(issue&&issue.mr){
    mrHTML='<div class="mr-card"><div class="row"><span class="mono">'+esc(issue.mr.label)+'</span><span class="chip '+(issue.mr.status==='merged'?'chip-green':'chip-outline')+'">'+esc(issue.mr.status==='merged'?'已合入':'开着')+'</span></div>'

      + '</div>';
  }
  return '<div class="sr-h">文件树</div><div data-filetree>'+treeHTML+'</div>'
    + '<div class="sr-h">改动文件</div>'+changedHTML
    + '<div class="sr-h">git</div>'+gitHTML
    + (mrHTML?('<div class="sr-h">MR</div>'+mrHTML):'');

function renderSession(pid,sidParam){
  var proj=getProject(pid); if(!proj) return '<section data-screen="session"><div class="detail-empty">项目不存在</div></section>';
  var groups=sessionGroups(pid);
  var sid=sidParam||state.ui.currentSession[pid]||(groups[1]?groups[1].sid:'shell');
  if(!groups.some(function(g){return g.sid===sid;})){
    var dynIssue=getIssue(pid,sid);
    if(dynIssue){
      var repoShort=(proj.repo||'repo').split('/').pop();
      groups.push({sid:sid,groupLabel:repoShort+'-issue-'+issueSuffix(sid)+' · '+branchOf(sid),title:dynIssue.title,sub:STATUS_LABEL[dynIssue.status],dot:STATUS_DOT[dynIssue.status]==='red'?'red':(dynIssue.status==='done'?'gray':'amber'),issue:dynIssue});
    } else { sid='shell'; }
  }
  state.ui.currentSession[pid]=sid;
  var leftHTML=groups.map(function(g){
    return '<div class="sess-group-label">'+esc(g.groupLabel)+'</div>'
      + '<div class="sess-row '+(sid===g.sid?'sel':'')+'"'+(g.issue?(' data-issue="'+g.issue.id+'"'):'')+' data-action="selectSession" data-arg=\'["'+pid+'","'+g.sid+'"]\'>'

      +   '<div class="body"><div class="ttl">'+esc(g.title)+'</div><div class="sub">'+esc(g.sub)+'</div></div>'
      + '</div>'
      + '<div class="sess-addnew">+ 新会话</div>';
  }).join('');
  var cur=groups.filter(function(g){return g.sid===sid;})[0];
  var issue=cur?cur.issue:null;
  var tabs=baseTabs(issue).concat(state.ui.sessionTabs[sid]||[]);
  var activeTab=state.ui.sessionActiveTab[sid]||tabs[0].id;
  if(!tabs.some(function(t){return t.id===activeTab;}))activeTab=tabs[0].id;

    var closable=t.kind==='file'||t.kind==='diff';

  var actionBar='';

      + '<button class="btn btn-sm" data-action="pushReview" data-arg=\'["'+pid+'","'+sid+'"]\' '+(canPush?'':'disabled')+'>推到评审</button>'
      + '<button class="btn btn-sm" data-action="distill" data-arg=\'["'+pid+'","'+sid+'"]\'>蒸馏</button>'

      + '</div>';

  return '<section data-screen="session"><div class="sess-grid">'
    + '<div class="sess-col"><div class="sess-left-scroll">'+leftHTML+'</div></div>'
    + '<div class="sess-col sess-mid">'+actionBar+'<div class="sess-tabs">'+tabsHTML+'</div><div class="sess-body">'+bodyHTML+'</div></div>'
    + '<div class="sess-col"><div class="sess-right-scroll">'+sessionRightHTML(pid,sid,issue)+'</div></div>'

/* ===================== 渲染:知识库(内部沿用 space/spaceTab 命名) ===================== */
function codeGraphSVG(){
  function box(x,y,w,h,label,lines){
    return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="7" fill="#FBFAF6" stroke="#C5654A" stroke-width="1.3"/>'
      + '<text x="'+(x+w/2)+'" y="'+(y+h/2-3)+'" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#23211C">'+label+'</text>'
      + '<text x="'+(x+w/2)+'" y="'+(y+h/2+13)+'" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#8C867A">'+lines+' 行</text>';
  }
  function arrow(x1,y1,x2,y2){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#8C867A" stroke-width="1.3" marker-end="url(#gArrow)"/>'; }
  return '<svg viewBox="0 0 760 220" width="100%" style="max-width:760px;display:block;">'
    + '<defs><marker id="gArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8C867A"/></marker></defs>'
    + arrow(130,113,190,63) + arrow(130,113,190,173) + arrow(300,63,380,103) + arrow(300,173,380,123) + arrow(490,113,560,63) + arrow(490,113,560,173)
    + box(20,90,110,46,'bw-core','4,997') + box(190,30,110,46,'bw-engine','6,098') + box(190,150,110,46,'bw-store','5,630')
    + box(380,90,110,46,'bw-app','27,572') + box(560,30,110,46,'ui','2,559') + box(560,150,110,46,'app-desktop','13,968')
    + '</svg>';
}
function renderSpace(pid,subTab){
  var tab=subTab||state.ui.spaceTab[pid]||'knowledge';
  state.ui.spaceTab[pid]=tab;
  var tabsHTML=[['knowledge','知识'],['graph','代码图'],['assets','资产']].map(function(t){return '<div class="tabbtn '+(tab===t[0]?'active':'')+'" data-action="setSpaceTab" data-arg=\'["'+pid+'","'+t[0]+'"]\'>'+t[1]+'</div>';}).join('');
  var body='';
  if(tab==='knowledge'){
    var docId=state.ui.spaceDoc[pid]||'k-project';
    var groups={};
    KNOWLEDGE_DOCS.forEach(function(d){ groups[d.group]=groups[d.group]||[]; groups[d.group].push(d); });
    var treeHTML=Object.keys(groups).map(function(g){
      return '<div class="sp-tree-group">'+esc(g)+'</div>' + groups[g].map(function(d){
        return '<div class="sp-tree-item '+(docId===d.id?'active':'')+'" data-action="selectKDoc" data-arg=\'["'+pid+'","'+d.id+'"]\'>'+esc(d.name)+'</div>';
      }).join('');
    }).join('');
    var doc=KNOWLEDGE_DOCS.filter(function(d){return d.id===docId;})[0];
    var previewHTML='<div class="detail-empty">选一份文档查看</div>';
    if(doc){
      var lines=doc.path?(FILE_CONTENTS[doc.path]||['(演示未内嵌内容)']):['(演示未内嵌内容,正本以仓文件为准)'];
      previewHTML='<h4>'+esc(doc.name)+'</h4>'+(doc.path?('<div class="path">'+esc(doc.path)+'</div>'):'')+'<pre>'+esc(lines.join('\n'))+'</pre>';
    }
    body='<div class="sp-layout"><div class="card sp-tree">'+treeHTML+'</div><div class="card sp-preview">'+previewHTML+'</div></div>';
  } else if(tab==='graph'){
    var q=(state.ui.symbolQuery[pid]||'').trim();
    var SYMBOL_RESULTS={
      'recompute_signals':[['crates/bw-store/src/sqlite.rs','persist_observation() 观测写入后触发'],['crates/bw-app/src/lib.rs','dispatch() 每次命令处理后调用'],['crates/ui/src/vm.rs','signal_color() 间接读取结果']],
      'can_transition_to':[['crates/bw-app/src/lib.rs','transition_issue() 状态机守卫'],['crates/app-desktop/src/screens/issues.rs','on_click_next() 按钮可见性判断']]
    };
    var results=SYMBOL_RESULTS[q];
    var resultsHTML=q?(results?results.map(function(r){return '<div class="symbol-result"><div class="h">'+esc(r[0])+'</div><div>'+esc(r[1])+'</div></div>';}).join(''):'<div class="detail-empty">—</div>'):'';
    body='<div class="graph-wrap">'
      + '<div class="graph-svgbox" data-codegraph>'+codeGraphSVG()+'</div>'
      + '<div class="graph-lower">'
      +   '<div class="card" style="padding:12px 14px;"><div class="sr-h" style="margin-top:0;">大文件榜</div>'
      +     [['crates/bw-app/src/lib.rs','12,102'],['crates/app-desktop/src/screens/op.rs','4,148'],['crates/bw-store/src/sqlite.rs','3,940'],['crates/bw-core/src/model.rs','2,238'],['crates/ui/src/vm.rs','2,086']].map(function(r){return '<div class="leaderboard-row"><span>'+esc(r[0])+'</span><span>'+r[1]+' 行</span></div>';}).join('')
      +   '</div>'
      +   '<div class="card" style="padding:12px 14px;"><div class="sr-h" style="margin-top:0;">符号 → 调用者 / 影响面</div>'
      +     '<input class="input symbol-search-input" placeholder="recompute_signals / can_transition_to" data-symbol-input data-pid="'+pid+'" value="'+esc(q)+'">'
      +     resultsHTML + '</div>'
      + '</div>'
      + '<div class="graph-foot">索引时间 2026-08-18 09:10 · codegraph explore</div>'
      + '</div>';
  } else if(tab==='assets'){
    var skills=state.skills[pid]||[], wfs=state.workflows[pid]||[];
    var own=skills.filter(function(s){return !s.distilled && /^项目导入/.test(s.source||'');});
    var distilled=skills.filter(function(s){return s.distilled;});
    function assetCards(list,metaFn){ return '<div class="asset-grid">'+list.map(function(x){return '<div class="card asset-card"><div class="name">'+esc(x.name)+'</div><div class="meta">'+esc(metaFn(x))+'</div></div>';}).join('')+'</div>'; }
    var artifacts=[
      {name:'mvp-blueprint-draft.md / .html',meta:'V4 全貌草案(三轮 grilling 收口)'},
      {name:'standard-module-draft.md',meta:'规范铺底模块设计稿'},
      {name:'research-orca.md 等预研三篇',meta:'Orca / DSH / codegraph 借鉴判断'},
      {name:'hifi/index.html',meta:'V4 高保真可点击原型(本文件)'}
    ];
    body=''
      + '<div class="asset-sect-title">项目自有技能</div>' + (own.length?assetCards(own,function(s){return (s.pkg||'独立')+' · '+(s.desc||'');}):'<div class="detail-empty">暂无</div>')
      + '<div class="asset-sect-title">蒸馏技能</div>' + (distilled.length?assetCards(distilled,function(s){return s.source;}):'<div class="detail-empty">暂无</div>')
      + '<div class="asset-sect-title">workflow</div>' + (wfs.length?assetCards(wfs,function(w){return w.source+' · '+w.oneliner;}):'<div class="detail-empty">暂无</div>')
      + '<div class="asset-sect-title">产物登记</div>' + assetCards(artifacts,function(a){return a.meta;})
      + '<div class="asset-sect-title">仓统计指标</div>'
      + '<div class="repostats" style="border:none;padding:0;">30 天提交 464 · Rust 115 文件 / 60,824 行 · docs 80 篇 · 技能 9 · 30 天 PR 数 7 · 开放 PR 4</div>';
  }
  return '<section data-screen="kb"><div class="card sp-topinfo"><span>规范 v4.0(最新)</span><span>对账 8 类核心件 <span style="color:var(--green);">✓</span></span><span style="margin-left:auto;"></span><button class="btn btn-sm" data-action="toastOnly" data-arg=\'"演示:规范差异为空,已是最新"\'>看差异</button><button class="btn btn-sm" data-action="toastOnly" data-arg=\'"演示:规范已是最新,无需升级"\'>升级</button></div>'
    + '<div class="tabbtn-row">'+tabsHTML+'</div>' + body + '</section>';
}

/* ===================== 渲染:通知 ===================== */
function chatSyncChipHTML(pid,kind){
  var g=state.chatGroup[pid];
  if(g && g.configured && g.sync && g.sync[kind]){ return ' <span class="chip chip-green">已发到群 ✓</span>'; }
  return '';
}
function renderNotify(pid){
  var pending=getInbox(pid);
  var events=(state.notifyEvents[pid]||[]).slice();
  var g=state.chatGroup[pid];
  var groupHintHTML = (!g||!g.configured)
    ? '<div style="font-size:11.5px;color:var(--ink-3);margin-bottom:10px;">配了项目群,这些通知能直达群 → <span style="color:var(--clay);cursor:pointer;" data-action="nav" data-arg=\'"#/p/'+pid+'/config"\'>配置</span></div>'
    : '';
  var pendingHTML=pending.length? pending.map(function(it){
    var acts='';
    var chip='';
    if(it.kind==='metric'){
      acts='<button class="btn btn-sm btn-ghost" data-action="openInboxIssue" data-arg=\'["'+pid+'","'+it.id+'"]\'>去补</button>';
    } else if(it.state==='pending'){
      chip=chatSyncChipHTML(pid,'review');
      acts='<button class="btn btn-sm btn-ghost" data-action="openInboxIssue" data-arg=\'["'+pid+'","'+it.id+'"]\'>打开</button>'
        + '<button class="btn btn-sm" data-action="mergeInbox" data-arg=\'["'+pid+'","'+it.id+'"]\'>合入</button>'
        + '<button class="btn btn-sm btn-primary" data-action="mergeAndCompleteInbox" data-arg=\'["'+pid+'","'+it.id+'"]\'>合入并完成</button>';
    } else if(it.state==='merged'){
      chip=chatSyncChipHTML(pid,'merged');
      acts='<button class="btn btn-sm btn-primary" data-action="completeInbox" data-arg=\'["'+pid+'","'+it.id+'"]\'>点完成</button>';
    }
    return '<div class="drawer-item"'+(it.issueId?(' data-issue="'+it.issueId+'"'):'')+'>'
      + '<div class="desc">'+esc(it.text)+(it.state==='merged'?' <span class="chip chip-green">已合入</span>':'')+chip+'</div>'
      + '<div class="acts">'+acts+'</div></div>';
  }).join('') : '<div class="drawer-empty">待处理已清空</div>';
  var eventsHTML=events.length? events.map(function(e){
    var clickable=!!e.link;
    return '<div class="notify-event"'+(clickable?(' data-action="goEventLink" data-arg=\'["'+pid+'","'+esc(e.link)+'"]\' style="cursor:pointer;"'):'')+'>'
      + '<span class="mono" style="color:var(--ink-3);flex:none;">'+esc(e.time)+'</span><span style="flex:1;">'+esc(e.text)+(e.processed?' <span class="chip chip-green">已处理</span>':'')+'</span></div>';
  }).join('') : '<div class="drawer-empty">暂无事件</div>';
  return '<section data-screen="notify" data-notify>'
    + '<h1 style="font-size:20px;">通知</h1>'
    + groupHintHTML
    + '<div class="notify-sect-title">待处理 · '+pending.length+'</div>'
    + '<div class="notify-list">'+pendingHTML+'</div>'
    + '<div class="notify-sect-title">事件</div>'
    + '<div class="notify-events">'+eventsHTML+'</div>'
    + '</section>';
}

/* ===================== 主渲染 / 路由分发 ===================== */
function screenHTML(){
  var parts=parseHash();
  var top=parts[0]||'wall';
  var screenSeg='wall', pid=null, sub2=null;
  if(top==='wall'||!parts.length){ screenSeg='wall'; }
  else if(top==='onboard'){ screenSeg='onboard'; }
  else if(top==='settings'){ screenSeg='settings'; }
  else if(top==='p'){ pid=parts[1]; screenSeg=parts[2]||'overview'; sub2=parts[3]; }
  else { screenSeg='wall'; }
  var inProject = top==='p' && !!getProject(pid);
  if(top==='p' && !inProject){ screenSeg='wall'; }
  var html='';
  if(!inProject && screenSeg==='wall') html=renderWall();
  else if(!inProject && screenSeg==='onboard') html=renderOnboard();
  else if(!inProject && screenSeg==='settings') html=renderSettings();
  else if(inProject && screenSeg==='overview') html=renderOverview(pid);
  else if(inProject && screenSeg==='plan') html=renderPlan(pid);
  else if(inProject && screenSeg==='session') html=renderSession(pid,sub2);
  else if(inProject && screenSeg==='notify') html=renderNotify(pid);
  else if(inProject && screenSeg==='config') html=renderConfig(pid);
  else if(inProject && screenSeg==='kb') html=renderSpace(pid,sub2);
  else html=renderWall();
  return {html:html,inProject:inProject,pid:pid,screenSeg:screenSeg};
}
function shellHTML(){
  var r=screenHTML();
  return iconRailHTML(r.inProject,r.screenSeg)
    + (r.inProject?projectRailHTML(r.pid,r.screenSeg):'')
    + '<div class="main">'+topbarHTML(r.inProject,r.pid,r.screenSeg)+'<div class="content">'+r.html+'</div></div>'
    + (!r.inProject&&r.screenSeg==='wall'?guideMarkupHTML():'')
    + modalHTML();
}
function render(){
  var active=document.activeElement;
  var bind=active&&active.getAttribute&&(active.getAttribute('data-bind')||active.getAttribute('data-bindchange'));
  var selStart=active&&typeof active.selectionStart==='number'?active.selectionStart:null;
  var selEnd=active&&typeof active.selectionEnd==='number'?active.selectionEnd:null;
  document.getElementById('app').innerHTML=shellHTML();
  saveState();
  if(bind){
    var el=document.querySelector('[data-bind="'+bind+'"], [data-bindchange="'+bind+'"]');
    if(el){ el.focus(); if(selStart!=null&&el.setSelectionRange){ try{ el.setSelectionRange(selStart,selEnd); }catch(_){} } }
  }
}
window.addEventListener('hashchange', render);
render();
})();
