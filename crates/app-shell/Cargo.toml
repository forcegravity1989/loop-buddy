[package]
name = "app-shell"
description = "V4 桌面壳(Dioxus 0.7 / wry):六入口 + 顶层三屏,一屏一目录,一个外部能力一个适配模块。"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
# 共存期用这个名字,和旧壳的 builders-workbench 分得开;删旧壳那次改回去。
name = "bw-v4-dev"
path = "src/main.rs"

[dependencies]
# 与旧壳同一个 hard-pin(=0.7.9)。desktop feature = wry WebView。
dioxus = { workspace = true, features = ["desktop"] }
v4-engine = { workspace = true }
bw-v4 = { workspace = true }
tokio = { workspace = true }
time = { workspace = true, features = ["std"] }
uuid = { workspace = true }
# 内嵌终端把字节 / 尺寸经 document::eval 送进 WebView,靠它做 JS 字面量转义。
serde_json = { workspace = true }
# 知识库屏渲染仓内 Markdown。只进这个 crate,内核零新增依赖。
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
