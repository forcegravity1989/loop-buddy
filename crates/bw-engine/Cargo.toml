[package]
name = "bw-engine"
description = "Workflow execution engine: WorkflowSpec → phase loop, the frozen Executor contract + a deterministic MockExecutor + a reusable consistency suite."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bw-core = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# C6 (plan/13 D5): `.bw/metrics.toml` parser.
toml = { workspace = true }
# C7 (plan/13 D7): rolling-window date macros (`@{7d}`) in github collect
# queries — types + Date arithmetic only, no wall-clock (`today` is passed in
# by the caller, keeping collection deterministic).
time = { workspace = true }
# MockExecutor's optional simulated latency (tokio::time); ClaudeCliExecutor
# shells out to the `claude` CLI (tokio::process). bw-engine is a native
# runtime crate (not in the wasm32 keepalive set), so this is consistent.
tokio = { workspace = true, features = ["process"] }
# V1 Issue2 W2: PTY for in-app terminal embedding. buddy is Windows-only, so
# Windows uses conpty-oxide (correctness-first ConPTY impl; portable-pty 0.9.0's
# ConPTY impl doesn't deliver child stdout to the reader — see
# docs/v1-prototype/issue2-metrics-interactive-loop.md §9). conpty-oxide is a
# native runtime dep — not a UI dep, passes guard-kernel-ui-free.sh (bw-engine
# does not touch dioxus/wry). Used by InteractiveCliExecutor::run_skill_pty to
# spawn `claude` in a PTY and stream bytes to the UI via Event::TerminalBytes.
# Non-Windows keeps portable-pty as a keepalive dep (bw-engine is a native
# runtime crate, not in the wasm32 set); the non-Windows path falls back to the
# InteractiveExecutor trait default (PTY not supported → caller uses run_skill).
[target.'cfg(windows)'.dependencies]
conpty-oxide = "0.1"

[target.'cfg(not(windows))'.dependencies]
portable-pty = "0.9"

[dev-dependencies]
tokio = { workspace = true }
# Integration tests implement `Executor` (a #[async_trait] trait) directly —
# tests/*.rs are separate crates and don't inherit normal dependencies.
async-trait = { workspace = true }
