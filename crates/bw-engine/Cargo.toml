[package]
name = "bw-engine"
description = "Workflow execution engine: WorkflowSpec → phase loop, the frozen Executor contract + a deterministic MockExecutor + a reusable consistency suite."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bw-core = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# C6 (plan/13 D5): `.bw/metrics.toml` parser.
toml = { workspace = true }
# C7 (plan/13 D7): rolling-window date macros (`@{7d}`) in github collect
# queries — types + Date arithmetic only, no wall-clock (`today` is passed in
# by the caller, keeping collection deterministic).
time = { workspace = true }
# MockExecutor's optional simulated latency (tokio::time); ClaudeCliExecutor
# shells out to the `claude` CLI (tokio::process). bw-engine is a native
# runtime crate (not in the wasm32 keepalive set), so this is consistent.
tokio = { workspace = true, features = ["process", "fs"] }
# PTY for the in-app embedded terminal (`pty_backend.rs`). Windows uses
# conpty-oxide (portable-pty 0.9.0's ConPTY impl doesn't deliver child stdout
# to the reader — see docs/v1-prototype/issue2-metrics-interactive-loop.md §9);
# macOS/Linux use portable-pty, with `nix` (safe `killpg` wrapper — bw-engine
# forbids unsafe code; already in the lock file via portable-pty) for the
# process-group kill on teardown. All native runtime deps — not UI deps, pass
# guard-kernel-ui-free.sh.
[target.'cfg(windows)'.dependencies]
conpty-oxide = "0.1"

[target.'cfg(unix)'.dependencies]
portable-pty = "0.9"
nix = { version = "0.28", features = ["signal"] }

[dev-dependencies]
tokio = { workspace = true }
# Integration tests implement `Executor` (a #[async_trait] trait) directly —
# tests/*.rs are separate crates and don't inherit normal dependencies.
async-trait = { workspace = true }
