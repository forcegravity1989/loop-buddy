name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  kernel:
    name: kernel + selectors (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32 for the "以后也许的 Web" keepalive; clippy/rustfmt for gates.
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # app-desktop needs system WebKit/GTK to build; the kernel job stays light
      # and never compiles it. Desktop build/packaging is a separate matrix (Tier B).
      - name: Clippy (default members)
        run: cargo clippy --workspace --exclude app-desktop -- -D warnings

      - name: Test (kernel + selectors + compile-fail doctests)
        run: cargo test

      - name: wasm32 keepalive (kernel + selectors compile to the web target)
        run: |
          cargo check -p bw-core --target wasm32-unknown-unknown --no-default-features
          cargo check -p ui --target wasm32-unknown-unknown

      - name: Kernel stays UI-free
        run: ./scripts/guard-kernel-ui-free.sh

  next-gates:
    name: next/ 门禁(vNext 连接器地基 + 行为读回)
    # `next/` 是独立的 Cargo workspace(自己的 Cargo.toml/Cargo.lock,不是
    # 根 workspace 的成员),门禁因此是独立一个 job,不并进上面的 `kernel`
    # ——两边互不干扰,任何一边挂了不连带另一边(next 切片二C)。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32 保「以后也许的 Web」;clippy/rustfmt 供门禁用。
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: next

      - name: Format
        run: cd next && cargo fmt --all --check

      # next 切片五E(design-s5-hexpanel.md §10.1 裁决 9「先按全量试;真
      # 过不去,按旧工程既有做法排除桌面壳并在 CI 配置里如实注明为什
      # 么,不静悄悄地放宽」):`app-desktop`(界面框架第一次进 next/)
      # 在**本地 macOS**(这个提交实际开发/验证用的机器)已经真的跑过
      # `cargo check --workspace` 与 `cargo clippy --workspace
      # --all-targets -- -D warnings` 全量档,两条都全绿、零告警(见
      # commit 正文与 task-s5c-report.md)——不是没试过就退让。这里排除
      # 它的原因和仓根 `kernel` job 排除 `app-desktop` 是**同一条**(见
      # 那个 job 上面的注释):Dioxus/wry 的 `desktop` 特性在 Linux 上要
      # 编译 `wry`/`tao` 这层原生 WebView 绑定,需要 `libwebkit2gtk`/
      # `libgtk-3`/`libayatana-appindicator3` 等系统开发包,这个仓库的
      # ubuntu-latest CI runner 从来没装过这些(仓根 `kernel` job 至今
      # 也从未在 CI 里编译过 `app-desktop`,只在开发者本机/
      # `point-bwdev-here.sh` 编译)。跟着同一条已验证过的先例走,不新
      # 开一条"给桌面壳装系统依赖"的路——那超出本片范围,且没有真实需
      # 要驱动它(点击在这套框架上本就打不通,验证主力是深链 + 读回,
      # 不依赖 CI 里能不能编出一个真窗口)。
      - name: Workspace check(不含 app-desktop,理由见上)
        run: cd next && cargo check --workspace --exclude app-desktop

      - name: Clippy(不含 app-desktop,理由见上;含 examples)
        run: cd next && cargo clippy --workspace --exclude app-desktop --all-targets -- -D warnings

      - name: Feature isolation — bw-connector(删任一连接器不影响其余)
        run: |
          cd next
          cargo check -p bw-connector --no-default-features
          cargo check -p bw-connector --no-default-features --features gh
          cargo check -p bw-connector --no-default-features --features codehub
          cargo check -p bw-connector --no-default-features --features script

      - name: wasm32 keepalive (bw-core)
        run: cd next && cargo check -p bw-core --target wasm32-unknown-unknown --no-default-features

      # next 切片五A:本地工作区能力独立成 crate(design-s5-hexpanel.md
      # §6)——`cargo check --workspace` 已经覆盖它,这一步单独点名是为了
      # 让「这个 crate 能独立编译」这件事在 CI 输出里可见,不只是隐含在
      # 全量检查里。
      - name: bw-workspace 独立编译
        run: cd next && cargo check -p bw-workspace

      - name: 编排层/内核不准直接进程调用
        run: ./scripts/guard-no-direct-process.sh

      # next 切片四A:编排层(bw-app)不准正式依赖引擎、存储层(bw-store)
      # 不准正式依赖连接器——两条都查解析后的真实依赖图
      # (design-s4-runmanager.md §1.2/§2.1/§8)。next 切片五A 加两条边:
      # 工作区 crate(bw-workspace)不准依赖连接器/编排层——方向单一,谁都
      # 能依赖它,它谁也不依赖(design-s5-hexpanel.md §6.2/§10.1 第 2 条)。
      - name: 编排层/存储层/工作区分层守卫
        run: ./scripts/guard-app-layering.sh

      # next 切片五E(design-s5-hexpanel.md §10.1 第 1 条):内核无界面依
      # 赖守卫加了 next 档(逐一查 next 六个内核 crate——不含 app-desktop,
      # 它是唯一允许出现界面框架依赖的 crate)。仓根 `kernel` job 已经在
      # 跑同一份脚本(它现在两档都查),这里再显式调一次,让 next-gates
      # 自己也是一个完整独立的门禁面——不依赖"另一个 job 顺便也查了"这
      # 件事才成立(next-gates 的既有原则:「两边互不干扰,任何一边挂了
      # 不连带另一边」)。`cargo tree` 只做依赖图解析,不需要 GTK/WebKit
      # 系统库,ubuntu-latest 上能正常跑。
      - name: 内核无界面依赖守卫(含 next 档)
        run: ./scripts/guard-kernel-ui-free.sh

      # next 切片五E(design-s5-hexpanel.md §4.1/§10.1 第 4 条):壳不持有
      # 调度时钟——源码扫描,没有 tokio::time::interval/sleep/.tick(。
      - name: 壳不持有调度时钟守卫
        run: ./scripts/guard-shell-no-clock.sh

      - name: 行为读回指挥器(bw-engine port_readback)
        run: cd next && cargo run -p bw-engine --example port_readback

      # next 切片五A:造工作树 + 采证 + 读项目正本换落点到 bw-workspace 之
      # 后,「A 自己要真跑一遍」(design-s5-hexpanel.md §10.2)——真
      # `git init`+真首提交+真 `git worktree add`,读回路径存在/分支对/
      # 幂等复用不产生第二棵工作树。末行 PROVISION_READBACK_OK。
      - name: 工作区供给行为读回指挥器(bw-workspace provision_readback)
        run: cd next && cargo run -p bw-workspace --example provision_readback

      # next 切片三-1 修(评审顺手一并 #9):PTY 后端接缝的本机烟测——起
      # 一个普通 shell 探针(不依赖 claude/网关),验证双向字节 + resize +
      # 干净收尾。runner 是 ubuntu(unix),可常绿;末行 PTY_SMOKE_OK。
      - name: PTY 后端烟测(bw-engine pty_smoke)
        run: cd next && cargo run -p bw-engine --example pty_smoke

      # next 切片三E:agentcli 层收官验收指挥器——不带 --real(真实 claude
      # 会话受网关抖动影响,只在人手/监理脚本里跑,design §7.3),其余四节
      # (注册表机械证明/类型断路/会话反查反证/mock 生命周期)全部确定性,
      # 可常绿。末行 AGENT_SESSION_OK。
      - name: agentcli 层验收指挥器(bw-engine agent_session)
        run: cd next && cargo run -p bw-engine --example agent_session

      # next 切片四A:存储层立起(项目/活/运行三表 + 迁移双守卫 + 两把结
      # 算/关门守卫)。指挥器插活 → 开两个交付运行(第二个被部分唯一索引
      # 挡下)→ 关门两次 → 结算两次 → 独立连接读回索引真的建了。末行
      # STORE_GUARDS_OK。
      - name: 存储层行为读回指挥器(bw-store store_guards)
        run: cd next && cargo run -p bw-store --example store_guards

      # next 切片四B/C/D:运行管理器本体(开工/取消/降级为咨询/重启清
      # 理)+ 十件并行 + 五竞态(同一件活开不出第二个交付运行/取消完成撞
      # 车/单条失败不牵连/重启遗留如实标注/晚到消息不错账)确定性复现,
      # sqlite 读回 + 存量库迁移双守卫。全程【mock】脚本化连接器,不依赖
      # 网关,可常绿。末行 RUN_RACES_OK。
      - name: 运行管理器行为验收指挥器(bw-app run_races)
        run: cd next && cargo run -p bw-app --example run_races

      # next 切片五C/D:编排层命令/事件总线按聚合拆(design-s5-hexpanel.md
      # §4.2)+ 六段总控/待人处理的组装用例(§4.3/§3)。指挥器造真 git 工
      # 作区 + 真 .bw/metrics.toml + 真项目/活/运行/观测/交棒,逐段读回断
      # 言、待人处理五项各自正反验一次(造出来→消掉→行自然消失)、重启
      # 前后同一份组装用例逐字段比对(裁决 4 的新验收形态)。不依赖网关,
      # 可常绿。末行 HEX_READBACK_OK。
      - name: 六段总控/待人处理行为验收指挥器(bw-app hex_readback)
        run: cd next && cargo run -p bw-app --example hex_readback
