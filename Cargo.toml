[workspace]
resolver = "2"
members = [
    "crates/bw-core",
    "crates/bw-engine",
    "crates/bw-store",
    "crates/bw-app",
    "crates/ui",
    "crates/app-desktop",
    # V4:四表库 + 仓文件解析 + 现算推导 + 命令/事件总线。与 bw-store/bw-app
    # 并列而不是改它们——库从 20 张表砍到 4 张后两边接不上,旧 crate 一行不动
    # 才能保住旧壳继续编译可跑。见 docs/v4-prototype/design/01-architecture.md。
    "crates/bw-v4",
    # V4 新壳(六入口)。与 app-desktop 并列,同样不进 default-members ——
    # 日常 cargo check/test 不因为多一个 UI crate 变慢。删旧壳那次去掉
    # app-desktop 那一行即可。
    "crates/app-shell",
    # V4 的能力底座:2026-08-21 从 bw-engine 拷过来接管的(不是复用)。V3 那
    # 一整个目录最终会被整体删掉,所以 V4 不能有任何一条依赖指向那边。
    "crates/v4-engine",
]
# `default-members` = the headless kernel + shared UI selector. Routine
# `cargo test` / `cargo check` therefore stay UI-free and fast — they never
# pull the Dioxus/wry dependency tree. Build the desktop shell explicitly with
# `cargo build -p app-desktop` (or `dx serve --package app-desktop`).
#
# There is no `app-web` crate: the Web shell is "以后也许" (docs/archive/plan/04
# §5). The architecture keeps the door open at zero cost (wasm32 CI check on
# bw-core/ui + Store trait + sync columns); the empty placeholder directory was
# removed 2026-08-17 — add the crate here when that day comes.
default-members = [
    "crates/bw-core",
    "crates/bw-engine",
    "crates/bw-store",
    "crates/bw-app",
    "crates/ui",
    "crates/bw-v4",
]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "MIT OR Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
# --- Kernel deps (must stay wasm32-compilable: no async, no IO, no UI) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["serde"] }
time = { version = "0.3", default-features = false, features = ["serde"] }
thiserror = "1"

# --- Runtime deps (native shells: bw-engine / bw-store / bw-app). Not in the
#     wasm32 keepalive set — the web swaps the Store impl + executor (Tier E). ---
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
# C6 (plan/13 D5): `.bw/metrics.toml` parser (bw-engine only — file IO stays
# out of bw-core). Already present transitively (system-deps → dioxus
# desktop's build chain) at 0.8.x; pinning the same major keeps one copy.
toml = "0.8"
# T2 (plan/12 §2): real YAML frontmatter parsing for SKILL.md import — a
# proper parser (not a hand-rolled line scanner) so quotes/multi-line
# descriptions/unknown fields (disable-model-invocation, …) are handled
# correctly instead of guessed at. bw-app only (native, IO-doing crate) —
# never touches the wasm32-checked kernel crates.
serde_yaml = "0.9"

# --- Internal crates (path deps) ---
# bw-core defaults to NO id-generation (no RNG) so pure consumers (ui) stay
# wasm-clean; native crates that mint ids opt in with features = ["idgen"].
bw-core = { path = "crates/bw-core", default-features = false }
bw-engine = { path = "crates/bw-engine" }
bw-store = { path = "crates/bw-store" }
bw-app = { path = "crates/bw-app" }
bw-v4 = { path = "crates/bw-v4" }
v4-engine = { path = "crates/v4-engine" }
app-shell = { path = "crates/app-shell" }
ui = { path = "crates/ui" }

# --- UI stack: hard-pinned (plan 00 §8 risk-2). 0.8.0-alpha is on the way and
#     would be a breaking change; views live only in app-desktop so a break is
#     contained. Bump deliberately, never via `^`. ---
dioxus = "=0.7.9"

# Smaller / faster release binary for the desktop shell.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
