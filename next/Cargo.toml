[workspace]
resolver = "2"
members = [
    "crates/bw-core",
    "crates/bw-workspace",
    "crates/bw-engine",
    "crates/bw-connector",
    "crates/bw-store",
    "crates/bw-app",
    # next 切片五E(design-s5-hexpanel.md §4):界面框架第一次进 next/。
    # 唯一允许依赖 dioxus 的 crate——`scripts/guard-kernel-ui-free.sh`
    # (next 档)/`scripts/guard-app-layering.sh` 守这条线。
    "crates/app-desktop",
]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "MIT OR Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
# --- Kernel deps (must stay wasm32-compilable: no async, no IO, no UI) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["serde"] }
time = { version = "0.3", default-features = false, features = ["serde"] }
thiserror = "1"

# --- Runtime deps (native shells: bw-engine and later crates). Not in the
#     wasm32 keepalive set. ---
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process"] }
async-trait = "0.1"
# `.bw/metrics.toml` parser (bw-engine only — file IO stays out of bw-core).
toml = "0.8"
# Cancellation tokens for bw-connector's `CallCtx` (next 切片二A) — the
# `CancellationToken` type that lets a caller cancel an in-flight connector
# call without reaching into the adapter's process handle.
tokio-util = "0.7"
# next 切片四A(bw-store):local SQLite persistence. Version pin aligned with
# the root workspace's existing `crates/bw-store` pin (root Cargo.toml) —
# same major, same feature set, so a future re-merge of next/ into root
# doesn't fight two sqlx versions.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

# --- UI stack: hard-pinned (design-s5-hexpanel.md §4.5), same version as the
#     root workspace's app-desktop (root Cargo.toml `dioxus = "=0.7.9"`) —
#     the ported layout judgments (top bar, metric cards) only line up if the
#     framework version matches. Bump deliberately, never via `^`, and never
#     together with an unrelated change.
dioxus = "=0.7.9"
