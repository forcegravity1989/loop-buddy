[package]
name = "bw-engine"
description = "Migrated from v1: four organs (evidence gathering / metrics-file-of-record parsing / terminal session management / interactive CLI). The Executor contract and MockExecutor are not yet ported; later slices will bring them over as needed."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bw-core = { path = "../bw-core" }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }

# V1 Issue2 W2: Windows uses conpty-oxide (correctness-first ConPTY impl) for
# in-app PTY terminal embedding. Wired into `pty_backend::windows` (next 切片
# 三B PTY 平台接缝提取)——函数体整段搬自这里原来的 `run_skill_pty` Windows
# override,零逻辑改写。
[target.'cfg(windows)'.dependencies]
conpty-oxide = "0.1"

# next 切片三B(主控裁决 #2:本机 macOS 是部署机,必须能真跑):Unix PTY
# 后端新写用 `portable-pty`——成熟上游库,选型优先于自建。装进
# `pty_backend::unix`,只在 unix 目标上编译,不影响 Windows 产物依赖面。
[target.'cfg(unix)'.dependencies]
portable-pty = "0.9"

[dev-dependencies]
# next 切片一C `examples/port_readback.rs` 需要直接构造 `OffsetDateTime` 喂给
# `bw_core::derive::measure`(该函数的 `now`/`as_of` 由调用方传入,模块本身
# 不摸挂钟,见 measure.rs 文档注释)。`bw-engine` 的正常依赖里没有 `time`
# (只有 bw-core 内部用),example 要点名这个类型就必须自己依赖它——只进
# dev-dependencies,不进正常依赖,不影响真实产物的依赖面。版本沿用工作区
# 既有 pin,无版本漂移。
time = { workspace = true }
