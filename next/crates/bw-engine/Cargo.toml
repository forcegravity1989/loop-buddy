[package]
name = "bw-engine"
description = "Migrated from v1: four organs (evidence gathering / metrics-file-of-record parsing / terminal session management / interactive CLI). The Executor contract and MockExecutor are not yet ported; later slices will bring them over as needed."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bw-core = { path = "../bw-core" }
# next 切片三C(design-s3-agentcli.md §1.1 裁决):agentcli 层落在 bw-engine
# 里,不新开 crate;它要实现 `bw_connector::caps::Execute` 并挂进同一份注册
# 表契约,因此需要这条依赖。方向 bw-engine → bw-connector → bw-core,单向,
# 不循环(bw-connector 不反向依赖 bw-engine)。`default-features = false`:
# agentcli 只用得到契约类型层(`contract`/`caps`/`registry`,均不在任何
# feature 门后面),gh/codehub/script 三家适配器 feature 用不上,不蹭它们的
# 默认打开。
bw-connector = { path = "../bw-connector", default-features = false }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }

# V1 Issue2 W2: Windows uses conpty-oxide (correctness-first ConPTY impl) for
# in-app PTY terminal embedding. Wired into `pty_backend::windows` (next 切片
# 三B PTY 平台接缝提取)——函数体整段搬自这里原来的 `run_skill_pty` Windows
# override,零逻辑改写。
[target.'cfg(windows)'.dependencies]
conpty-oxide = "0.1"

# next 切片三B(主控裁决 #2:本机 macOS 是部署机,必须能真跑):Unix PTY
# 后端新写用 `portable-pty`——成熟上游库,选型优先于自建。装进
# `pty_backend::unix`,只在 unix 目标上编译,不影响 Windows 产物依赖面。
[target.'cfg(unix)'.dependencies]
portable-pty = "0.9"
# next 切片三-1 修(评审 must-fix #1):收尾按进程组 `killpg` 真杀,需要
# `libc::killpg`/`libc::kill`。选 `libc` 不选 `nix`:两者都已经是
# `portable-pty` 自身的依赖(`portable-pty` 内部杀单个 pid 就是直接调
# `libc::kill`,见其 `src/lib.rs`),`libc` 的裸 extern 调用不需要 `nix`
# 那层 `Signal`/`Pid` 包装类型做转换,本片只用得到一个信号常量 + 一次
# `killpg` 调用,选薄的那个——零新增依赖面(两者都已在锁文件里,选哪个
# 都不增加编译的包数量),选择本身只是接口粗细的取舍。
libc = "0.2"

[dev-dependencies]
# next 切片一C `examples/port_readback.rs` 需要直接构造 `OffsetDateTime` 喂给
# `bw_core::derive::measure`(该函数的 `now`/`as_of` 由调用方传入,模块本身
# 不摸挂钟,见 measure.rs 文档注释)。`bw-engine` 的正常依赖里没有 `time`
# (只有 bw-core 内部用),example 要点名这个类型就必须自己依赖它——只进
# dev-dependencies,不进正常依赖,不影响真实产物的依赖面。版本沿用工作区
# 既有 pin,无版本漂移。
time = { workspace = true }
