[package]
name = "bw-connector"
description = "BW 对外借力的连接器契约层:最小机器契约类型 + 按能力拆的四个小接口 + 统一登记分发的注册表。gh/codehub(切片二B)与 script(切片二C)三家首发适配器均已真实收编;agentcli(切片三,在 bw-engine 实现)通过同一契约挂进注册表。"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["gh", "codehub", "script"]
# 仓连接器:gh(GitHub CLI)。骨架阶段这个 feature 只打开
# `adapters::gh` 占位模块,不含实现。
gh = []
# 仓连接器:codehub-cli(内源)。同上,骨架阶段只占位。
codehub = []
# 采集连接器:项目仓里的采集脚本(`.bw/connectors.toml` 正本)。
# 唯一需要额外依赖的一家 —— 解析 toml 正本要 `toml` crate。
script = ["dep:toml"]

[dependencies]
bw-core = { path = "../bw-core" }
async-trait = { workspace = true }
thiserror = { workspace = true }
# 切片二A 曾因「骨架阶段没代码用它」删掉(只留 serde_json)。切片二B 收编
# v1 github.rs/codehub.rs 后需要它回来:两家上游文件都有
# `#[derive(serde::Deserialize)]` 的响应结构体(`RepoJson`/`NamespaceJson`
# 等),workspace 的 `serde` 已带 `features = ["derive"]`,这里直接继承。
serde = { workspace = true }
serde_json = { workspace = true }
# `RequestId::new()` 要 v4(随机)生成。workspace 的 `uuid` 默认关掉 v4(内核
# crate 要保 wasm32 可编译),这里显式声明,不隐式蹭 bw-core 的 `idgen`
# feature 顺带打开——那条依赖链纯属巧合,不该是 bw-connector 能编译的原因。
uuid = { workspace = true, features = ["v4"] }
time = { workspace = true }
tokio = { workspace = true, features = ["process", "time", "fs"] }
tokio-util = { workspace = true }
toml = { workspace = true, optional = true }
