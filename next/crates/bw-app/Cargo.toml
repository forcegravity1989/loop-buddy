[package]
name = "bw-app"
description = "next 切片四:编排层。运行管理器住在这里(design-s4-runmanager.md §1)——它要写库、要判状态机,这是编排的活,不是引擎的活。切片四B:运行管理器单口(开工/取消/重启清理/快照),单条命令队列 + 循环独占内存活跃表,竞态串行化天然成立。正式依赖里刻意没有 bw-engine——PTY 那堆原生依赖渗不进编排层(§1.2),`scripts/guard-app-layering.sh` 守这条线。"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# 带 idgen(默认已开)——编排层要生成新编号(运行编号等)。
bw-core = { path = "../bw-core" }
bw-connector = { path = "../bw-connector", default-features = false }
bw-store = { path = "../bw-store" }
tokio = { workspace = true }
time = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
# 运行管理器的取消令牌(`RunManagerConfig`/轮询任务的退出信号)——
# `bw_connector::CallCtx.cancel` 同一个类型,单条命令队列 + 循环独占那套
# 并发纪律靠它(design-s4-runmanager.md §3.2)。
tokio-util = { workspace = true }

# 刻意没有 [dev-dependencies]:「真实并行三件」那一档(切片四E 的
# run_races --real,要把真的 claude 执行连接器组装进注册表)才会真的用
# 到 bw-engine——那时才加,不预置一个当下没有消费者的依赖(design
# §1.2:dev 依赖合法,但不是现在就要有)。`run_races` 指挥器本体是切片
# 四D 的事,同样还没有消费者。
