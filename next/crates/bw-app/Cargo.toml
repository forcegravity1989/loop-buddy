[package]
name = "bw-app"
description = "next 切片四:编排层。运行管理器住在这里(design-s4-runmanager.md §1)——它要写库、要判状态机,这是编排的活,不是引擎的活。切片四B/C 立起运行管理器单口(开工/取消/降级为咨询/重启清理);切片四D 起 [dev-dependencies] 装配 run_races 验收指挥器所需的 bw-engine/uuid/async-trait/sqlx——只进 dev-dependencies,正式依赖里刻意没有 bw-engine(§1.2),`scripts/guard-app-layering.sh` 守这条线(查 cargo tree -e normal 真实依赖图,dev 依赖不受影响)。"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# 带 idgen(默认已开)——编排层要生成新编号(运行编号等)。
bw-core = { path = "../bw-core" }
bw-connector = { path = "../bw-connector", default-features = false }
bw-store = { path = "../bw-store" }
# next 切片五C(design-s5-hexpanel.md §6.2 分层图:bw-workspace ← bw-app):
# `cmd::metric::sync_metrics_file` 用例要读项目仓正本(`metrics_lenient::
# read_lenient` + `metric_shape::flatten_lenient`);六段视图组装用例(交
# 付证据段③)要现采工作区证据(`evidence::collect`,§2.6「现采不落库」)。
# 这是 `bw-workspace` 第一次被正式产物依赖(此前只在 `bw-store`/`bw-app`
# 各自的 [dev-dependencies] 里当指挥器夹具)。
bw-workspace = { path = "../bw-workspace" }
tokio = { workspace = true }
time = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
# 运行管理器的取消令牌(`RunManagerConfig`/轮询任务的退出信号)——
# `bw_connector::CallCtx.cancel` 同一个类型,单条命令队列 + 循环独占那套
# 并发纪律靠它(design-s4-runmanager.md §3.2)。
tokio-util = { workspace = true }

[dev-dependencies]
# next 切片四E:「真实并行三件」档(`run_races --real`)要把真的 claude 执
# 行连接器组装进注册表——四-1 报告 concern 1 预告的「下一任务需要时补一
# 行」就是现在。**只进 dev-dependencies**:`bw-engine` 的 PTY/agentcli 原
# 生依赖不该渗进编排层的正式产物依赖图,`scripts/guard-app-layering.sh`
# 已经改成查 `cargo tree -e normal`(只看正式依赖边),这行不会被它误伤
# (design §1.2)。
bw-engine = { path = "../bw-engine" }
# `run_races.rs` 自己造临时数据库文件名/工作区目录名要用(与 `bw-store`
# `examples/store_guards.rs` 同款先例:uuid v4 命名,PID 会被系统复用,
# uuid 不会)。
uuid = { workspace = true, features = ["v4"] }
# `run_races.rs` 自建的脚本化 mock 执行连接器(design §4.1)要实现
# `bw_connector::caps::Execute`——那条 trait 本身是 `#[async_trait]` 定义
# 的,实现方也要用同一个宏。只进 dev-dependencies:mock 连接器不进任何
# crate 的正式代码(design §4.1「住在指挥器里,不进库」)。
async-trait = { workspace = true }
# `run_races.rs`「附 · 存量库迁移双守卫」一节(design §5.2 第 9 条)要自
# 己开一条独立连接、手工执行一份「少一列的老 schema」——不经过
# `SqliteStore::open`(那样会用当前 schema.sql 把列建全,测不出「老库缺
# 列」这件事),同 `bw-store` `examples/store_guards.rs` 第 6 节的独立连
# 接读回先例。`import_legacy.rs` 复用同一个依赖:合成老库指挥器同样要自
# 己开一条独立连接、照 v1 schema 原文建六张表。
sqlx = { workspace = true }
# next 切片七B(design-s7-real-project.md §2.4 硬约束 1 / §8.1):`import_
# legacy.rs` 要调 `bw_store::ImportStore`(导入专用写入面)——只有开了
# `import` 这个 cargo 特性,`bw-store` 才会把这条 trait 编译出来。**只加
# 在 [dev-dependencies]**,与上面 `[dependencies]` 里那行不带特性的
# `bw-store` 各自独立:resolver v2 对同一个 crate 的 normal 依赖边与 dev
# 依赖边分别做特性统一,`app-desktop`(经这个 crate 的 normal 依赖边)链
# 接的还是不开 `import` 的那一份,`scripts/guard-import-feature-off.sh`
# 查的正是这条边。
bw-store = { path = "../bw-store", features = ["import"] }
